<!doctype html>
<html><body style="margin:0;background:#f5f5f4;font-family:Inter,Arial,sans-serif;color:#18181b">
<div style="max-width:560px;margin:0 auto;padding:32px 16px">
<div style="background:#ffffff;border:1px solid #e7e5e4;border-radius:12px;padding:28px 32px">
<p style="margin:0 0 16px;font-weight:700;font-size:19px;letter-spacing:-0.03em">waggle<span style="color:#f5b014">.</span></p>
<h1 style="margin:0 0 12px;font-size:22px;font-weight:600">Confirm your new email</h1>
<p style="margin:0 0 20px;line-height:1.5;color:#3f3f46">Confirm that {{ .NewEmail }} should be the email for your Waggle login.</p>
<p style="margin:0 0 20px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#f5b014;color:#18181b;font-weight:600;text-decoration:none;padding:12px 18px;border-radius:8px">Confirm new email</a></p>
<p style="margin:0;font-size:13px;line-height:1.5;color:#71717a">Didn't ask for this? Ignore this email; nothing changes.</p>
</div></div></body></html>
